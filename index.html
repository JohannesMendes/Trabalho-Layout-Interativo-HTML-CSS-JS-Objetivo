<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER.DRIP | Catálogo 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>SNEAKER.DRIP</h1>
            <p>Catálogo Essencial 2026</p>
        </div>
    </header>

    <main id="catalog" class="container">
        </main>

    <footer>
        <p>&copy; 2026 SNEAKER.DRIP. Todos os direitos reservados.</p>
    </footer>

    <script>
        const catalog = document.getElementById('catalog');
        
        // Array com links de imagens reais de tênis para variar
        const sneakerImages = [
            "https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1549298916-b41d501d3772?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=600&auto=format&fit=crop"
        ];

        // Simulando 50 tênis
        for (let i = 1; i <= 50; i++) {
            const shoeCard = document.createElement('div');
            shoeCard.className = 'card';
            
            // Sorteia uma imagem da nossa lista
            const randomImg = sneakerImages[i % sneakerImages.length];
            const price = Math.floor(Math.random() * (950 - 350) + 350);

            shoeCard.innerHTML = `
                <div class="img-container">
                    <img src="${randomImg}" alt="Tênis Modelo ${i}" loading="lazy">
                </div>
                <div class="info">
                    <h3>Sneaker Drip #${i}</h3>
                    <p class="price">R$ ${price},90</p>
                    <button class="btn-detalhes">Ver Detalhes</button>
                </div>
            `;
            catalog.appendChild(shoeCard);
        }
    </script>
</body>
</html>
