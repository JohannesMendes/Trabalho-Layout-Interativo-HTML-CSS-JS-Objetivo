<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tênis Store — Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css"> </head>
<body class="dark-theme">

    <header class="topbar">
        <div class="branding">
            <span class="logo">👟</span>
            <h1 class="site-title">Tênis Store</h1>
        </div>
        <nav class="actions">
            <button id="seedBtn" class="btn primary">Repopular</button>
            <button id="clearFavBtn" class="btn danger">Limpar favoritos</button>
            <button id="toggleThemeBtn" class="btn ghost">Alternar tema</button>
        </nav>
    </header>

    <main class="layout">
        <aside class="filters-panel">
            <h2>Filtros</h2>
            <form id="filtersForm" class="filters">
                <div class="field">
                    <label>Busca</label>
                    <input id="searchInput" type="search" placeholder="Modelo ou marca...">
                </div>

                <div class="row">
                    <div class="field">
                        <label>Marca</label>
                        <select id="brandSelect">
                            <option value="">Todas</option>
                            <option>Nike</option>
                            <option>Adidas</option>
                            <option>New Balance</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Número</label>
                        <select id="sizeSelect">
                            <option value="">Todos</option>
                            <option>39</option>
                            <option>40</option>
                            <option>41</option>
                        </select>
                    </div>
                </div>

                <label class="toggle">
                    <input id="onlyFavInput" type="checkbox">
                    <span>Somente favoritos</span>
                </label>

                <div class="actions-row">
                    <button type="submit" class="btn primary full-width">Aplicar Filtros</button>
                </div>
            </form>

            <div class="stats">
                <p>Visíveis: <span id="visibleCount">20</span></p>
                <p>Favoritos: <span id="favCount">0</span></p>
            </div>
        </aside>

        <section class="catalog">
            <div class="catalog-header">
                <h2>Catálogo de Tênis</h2>
                <p>Modelos responsivos e atualizados</p>
            </div>
            <div id="grid" class="grid">
                </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
