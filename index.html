<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Tênis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="tema-escuro">

    <header class="barra-superior">
        <div class="marca">
            <span class="logotipo">👟</span>
            <h1 class="titulo-site">Tênis Store</h1>
        </div>
        <nav class="acoes">
            <button class="btn primario">Repopular</button>
            <button class="btn perigo">Limpar favoritos</button>
            <button class="btn fantasma">Tema alternativo</button>
        </nav>
    </header>

    <main class="layout">
        <aside class="painel-de-filtros">
            <h2>Filtros</h2>
            <form class="filtros">
                <div class="campo">
                    <label>Busca</label>
                    <input type="search" placeholder="Modelo ou marca...">
                </div>
                <button type="submit" class="btn primario" style="width: 100%; margin-top: 20px;">Aplicar Filtros</button>
            </form>
            
            <div class="estatisticas" style="margin-top: 20px;">
                <p>Visíveis: 20</p>
                <p>Favoritos: 0</p>
            </div>
        </aside>

        <section class="catalogo">
            <h2>Catálogo de Tênis</h2>
            <p>Modelos responsivos e atualizados</p>
            <div id="grid" class="grid-tenis">
                <div class="card-tenis">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400&q=80" alt="Tênis">
                    <div class="info">
                        <h3>Nike Red Special</h3>
                        <p>R$ 599,00</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
